# Yuki — Lots 0-1 : socle, porte de compatibilité & noyau texte
# Le service `gateway` est déclaré ici ; le service `tts` (Lot 7, audio.cpp
# CUDA) est OPT-IN derrière le profil Compose `tts`
# (`docker compose --profile tts up -d`) et n'est donc pas démarré par défaut.
# Pas de clé `version:` (obsolète en Compose v5).
#
# Ce compose TIRE l'image publiée (`ghcr.io/grokuku/yuki`) : `docker compose up -d`
# suffit, sans construire ni préparer l'hôte. La persistance passe par 5 VOLUMES
# NOMMÉS (plus de bind mounts) — voir la section `volumes:` du service.
#
# Pour construire en local : `compose.build.example.yml`.
# Pour revenir à des bind mounts : `compose.bind.example.yml`.
# Aucun tag flottant : l'image Node du Dockerfile est épinglée par digest.

name: yuki

services:
  gateway:
    # Image publiée sur ghcr.io (références EN MINUSCULES). Construite par la CI :
    # `test-build.yml` (`:test`) et `release.yml` (`:latest` / `:<version>`).
    # Le compose de BASE tire l'image ; pour construire en local, voir
    # `compose.build.example.yml`.
    image: ghcr.io/grokuku/yuki:${YUKI_VERSION:-latest}
    container_name: yuki-gateway

    env_file:
      - .env
    environment:
      NODE_ENV: production
      YUKI_VERSION: ${YUKI_VERSION:-0.1.0}
      YUKI_GATEWAY_PORT: "8080"
      YUKI_GATEWAY_HOST: 0.0.0.0
      # `YUKI_GPU_CMD` n'est PAS défini ici : sinon le code croirait toujours que
      # la variable a été fournie (`source` = `env-override`). Le défaut
      # (`nvidia-smi`) est appliqué par le code ; la surcharge reste possible
      # via `.env` (chargé par `env_file`).
      YUKI_MOUNT_PI_AGENT: /data/pi
      YUKI_MOUNT_WORKSPACE: /workspace
      YUKI_MOUNT_MODELS: /models
      YUKI_MOUNT_STATE: /data/state
      # Volume des voix TTS (Lot 7) — le gateway l'écrit (registre + WAV).
      YUKI_MOUNT_VOICES: /voices

      # --- Pi embarqué (Lot 1) — câblage uniquement ---
      # Redirection de l'état du SDK hors du rootfs read-only (volume yuki-pi).
      YUKI_PI_AGENT_DIR: /data/pi/agent
      YUKI_PI_SESSIONS_DIR: /data/pi/agent/sessions
      YUKI_PI_HOME: /data/pi/home
      YUKI_PI_CWD: /workspace
      YUKI_PI_SYSTEM_PROMPT: /app/config/pi/system-prompt.md
      YUKI_PI_SETTINGS_SEED: /app/config/pi/settings.json
      YUKI_PI_HEAVY_SYSTEM_PROMPT: /app/config/pi/system-prompt-heavy.md

      # HOME inscriptible (replis du SDK via os.homedir()).
      HOME: /data/pi/home
      # Environnement SDK (redondant avec le code, explicite ici).
      PI_CODING_AGENT_DIR: /data/pi/agent
      PI_CODING_AGENT_SESSION_DIR: /data/pi/agent/sessions
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"

      # Injecte `nvidia-smi` dans le conteneur -> preuve du passthrough GPU.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    # Exécution non-root. ⚠️ L'image TIRÉE est construite avec uid/gid 1000 (voir
    # `ARG YUKI_UID/YUKI_GID` dans le Dockerfile). Changer `YUKI_UID`/`YUKI_GID`
    # dans `.env` SANS reconstruire l'image ferait tourner le conteneur avec un
    # uid différent de celui du volume → erreurs de permissions. Ne les changer
    # que si l'on reconstruit l'image (`compose.build.example.yml`) avec les
    # mêmes valeurs.
    user: "${YUKI_UID:-1000}:${YUKI_GID:-1000}"

    ports:
      - "${YUKI_GATEWAY_PORT:-8080}:8080"

    # 5 VOLUMES NOMMÉS (et non des bind mounts). Pour un volume nommé monté sur
    # un chemin qui EXISTE déjà dans l'image, Docker initialise le volume en
    # recopiant le CONTENU et le PROPRIÉTAIRE du répertoire de l'image (créé en
    # `YUKI_UID:YUKI_GID` par le Dockerfile). Le conteneur non-root écrit donc
    # sans aucune préparation sur l'hôte — `docker compose up -d` suffit.
    volumes:
      - type: volume
        source: yuki-pi
        target: /data/pi
      - type: volume
        source: yuki-workspace
        target: /workspace
      - type: volume
        source: yuki-models
        target: /models
        read_only: true
      - type: volume
        source: yuki-state
        target: /data/state
      # Lot 7 : registre + échantillons de voix (rw pour le gateway, ro pour `tts`).
      - type: volume
        source: yuki-voices
        target: /voices

    networks:
      - yuki-net

    restart: unless-stopped
    init: true

    # Rootfs immuable ; seul /tmp est inscriptible (tmpfs).
    read_only: true
    tmpfs:
      - /tmp

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    # Healthcheck sans curl : le binaire Node embarque `fetch`.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Réservation GPU (forme requise par le NVIDIA Container Toolkit).
    # `capabilities` est obligatoire.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ===========================================================================
  # Service TTS (Lot 7) — audio.cpp (Chatterbox Multilingual V3, CUDA NVIDIA).
  #
  # OPT-IN : derrière le profil Compose `tts`, il n'est PAS démarré par
  # `docker compose up -d` (image CUDA volumineuse, GPU requis). Pour l'activer :
  #
  #     docker compose --profile tts up -d
  #
  # Variante CUDA : l'image se choisit via `YUKI_TTS_IMAGE` dans `.env`
  # (`full-cuda13` par défaut, `full-cuda12` si le driver l'impose).
  #
  # ⚠️ POINTS À VÉRIFIER EN RÉEL (spec §13/C14) : le CLI exact du serveur
  # audio.cpp et l'emplacement de son fichier de config (voice_presets / 
  # voice_dir) ne sont pas documentés dans les archives. La commande ci-dessous
  # est celle de la spec §11.2, à ajuster si le binaire diffère.
  # ===========================================================================
  tts:
    image: ${YUKI_TTS_IMAGE:-ghcr.io/0xshug0/audio.cpp:full-cuda13}
    container_name: yuki-tts
    profiles: ["tts"]
    # CLI supposé : serveur HTTP sur le port interne 8081 (aligné sur le défaut
    # `tts.baseUrl` = http://tts:8081). À confirmer (C14).
    command: ["--server", "--host", "0.0.0.0", "--port", "8081"]
    networks:
      - yuki-net
    volumes:
      # Modèle GGUF pré-déposé (ro) — jamais écrit par le service (§11.6).
      - type: volume
        source: yuki-models
        target: /models
        read_only: true
      # Voix : le service ne fait que LIRE les échantillons du registre Yuki.
      - type: volume
        source: yuki-voices
        target: /voices
        read_only: true
    # Réservation GPU (même forme que le gateway).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    # Rootfs immuable ; /tmp inscriptible (tmpfs).
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  yuki-net:
    name: yuki-net

# Noms de volumes EXPLICITES et stables (sans préfixe de projet) : faciles à
# sauvegarder, inspecter et restaurer avec `docker volume …`. Voir docs/runbook.md.
volumes:
  yuki-pi:
    name: yuki-pi
  yuki-workspace:
    name: yuki-workspace
  yuki-models:
    name: yuki-models
  yuki-state:
    name: yuki-state
  # Lot 7 : médias de voix (registre `voices.json` + WAV) — volume dédié.
  yuki-voices:
    name: yuki-voices
