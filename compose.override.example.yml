# Surcharges locales typiques.
#
#   cp compose.override.example.yml compose.override.yml
#
# `compose.override.yml` est gitignoré et appliqué automatiquement par
# `docker compose`. Ce fichier d'exemple documente les cas courants.

services:
  gateway:
    # Exposer le gateway sur un autre port hôte (le conteneur reste sur 8080).
    ports:
      - "9090:8080"

    environment:
      # Verbeux en développement local.
      YUKI_LOG_LEVEL: debug
      # ⚠️ Depuis le Lot 11, la politique de compatibilité GPU (`compatMode`,
      # `profile`, `minDriver`) se configure dans la page `/config` et non via
      # l'environnement. Définir `YUKI_COMPAT_MODE` ici VERROUILLE le champ
      # (badge « Verrouillé par l'environnement ») et rend le PUT refusé.
      # Pour dégrader sans bloquer une machine de dev, préférez `/config`.
      # YUKI_COMPAT_MODE: auto-degrade

    # Épingler une carte précise plutôt que toutes.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
