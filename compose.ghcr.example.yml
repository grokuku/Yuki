# =============================================================================
# Yuki — Surcharge Compose : DÉPLOYER depuis l'image PUBLIÉE (GHCR).
#
# Rôle : consommer l'image construite et publiée par
# `.github/workflows/release.yml`, SANS jamais la reconstruire localement.
# Le compose de base (`docker-compose.yml`) reste la référence : on ne le
# modifie pas, on le surcharge.
#
# Nom d'image : DÉRIVÉ du dépôt `github.com/grokuku/Yuki`
#   → `ghcr.io/grokuku/yuki`     (les références ghcr sont EN MINUSCULES)
# Tags publiés par le workflow : `:latest`, `:sha-<court>` et, si une version a
# été fournie, `:<version>`.
#
# -----------------------------------------------------------------------------
# Usage
# -----------------------------------------------------------------------------
#   # 1) (première fois, si le paquet est privé) s'authentifier sur ghcr.io :
#   #    docker login ghcr.io -u <utilisateur>   # + PAT avec scope read:packages
#   #
#   # 2) tirer l'image publiée puis démarrer :
#   docker compose -f docker-compose.yml -f compose.ghcr.example.yml pull
#   docker compose -f docker-compose.yml -f compose.ghcr.example.yml up -d
#
#   # Épingler un artefact reproductible plutôt que `:latest` :
#   #   remplacer le `image:` ci-dessous par `ghcr.io/grokuku/yuki:sha-abcdef1`
#   #   (ou `:<version>`).
#
#   # Pour rendre la surcharge implicite, la copier sous `compose.ghcr.yml` et
#   # utiliser `-f docker-compose.yml -f compose.ghcr.yml` (ce fichier n'est PAS
#   # auto-chargé : le seul fichier auto-chargé par Compose est
#   # `compose.override.yml`, gitignoré).
# -----------------------------------------------------------------------------
# ⚠️ Prérequis : Docker Compose >= 2.24 (tag `!reset`). Déjà requis par
#    `.github/ci/compose.ci.yml`, donc cohérent avec le projet.
#
# ⚠️ Le compose de base déclare à la fois `build:` et `image:`. Pour DÉPLOYER
#    (et non reconstruire), il faut retirer le `build:` hérité : c'est le rôle du
#    `!reset` ci-dessous. On conserve tout le reste (rootfs read-only, `tmpfs`,
#    utilisateur non-root, bind mounts, healthcheck, réservation GPU).
# =============================================================================
services:
  gateway:
    # `!reset` supprime la clé `build:` héritée du compose de base : l'image
    # n'est plus construite localement mais TIRÉE du registre (`pull`).
    build: !reset
    # Image publiée sur GHCR (minuscules obligatoires).
    image: ghcr.io/grokuku/yuki:latest
