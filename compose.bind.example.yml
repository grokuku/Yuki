# =============================================================================
# Yuki — Surcharge Compose d'exemple : revenir à des BIND MOUNTS.
#
# Rôle : monter des dossiers de l'hôte (par défaut `./.local/…`) au lieu des
# volumes nommés, pour voir/éditer les fichiers directement depuis l'hôte.
#
# ⚠️ Les bind mounts obligent à PRÉPARER LES PERMISSIONS sur l'hôte : Docker
#    crée les dossiers manquants en `root:root`, alors que le conteneur tourne
#    en non-root (`YUKI_UID:YUKI_GID`). Sans préparation, `/health/ready`
#    répond 503. Préparez les dossiers À LA MAIN avant de démarrer :
#
#      mkdir -p .local/pi .local/workspace .local/models .local/state .local/voices .local/tts-config
#      chown -R 1000:1000 .local
#
#    (`./scripts/up.sh` ne prépare plus rien : il se contente de
#     `docker compose up -d` + attente du healthcheck.)
#
# -----------------------------------------------------------------------------
# Usage
# -----------------------------------------------------------------------------
#   docker compose -f docker-compose.yml -f compose.bind.example.yml up -d
#
# Chemins hôte personnalisables via `.env` (comme avant) :
#   YUKI_HOST_PI_AGENT_DIR=./.local/pi
#   YUKI_HOST_WORKSPACE_DIR=./.local/workspace
#   YUKI_HOST_MODELS_DIR=./.local/models
#   YUKI_HOST_STATE_DIR=./.local/state
#   YUKI_HOST_VOICES_DIR=./.local/voices
#   YUKI_HOST_TTS_CONFIG_DIR=./.local/tts-config
# =============================================================================
services:
  gateway:
    # `!override` (Docker Compose >= 2.24) REMPLACE la liste de volumes héritée
    # du compose de base (sinon les deux jeux de montages se cumuleraient et
    # deux montages viseraient les mêmes cibles).
    volumes: !override
      - type: bind
        source: ${YUKI_HOST_PI_AGENT_DIR:-./.local/pi}
        target: /data/pi
      - type: bind
        source: ${YUKI_HOST_WORKSPACE_DIR:-./.local/workspace}
        target: /workspace
      - type: bind
        source: ${YUKI_HOST_MODELS_DIR:-./.local/models}
        target: /models
        read_only: true
      # Lot 9 (M1) : SECOND montage du MÊME dossier hôte, en `rw`, réservé aux
      # téléchargements (`/models-dl/downloads/`). `/models` RESTE `ro`.
      - type: bind
        source: ${YUKI_HOST_MODELS_DIR:-./.local/models}
        target: /models-dl
      # Lot 9 (M2) : dossier de config du moteur, en `rw` côté gateway.
      - type: bind
        source: ${YUKI_HOST_TTS_CONFIG_DIR:-./.local/tts-config}
        target: /data/tts-config
      - type: bind
        source: ${YUKI_HOST_STATE_DIR:-./.local/state}
        target: /data/state
      - type: bind
        source: ${YUKI_HOST_VOICES_DIR:-./.local/voices}
        target: /voices

  # Le service `tts` (profil `tts`) est aussi converti en bind mounts. Sa
  # commande est inchangée : `server --config /config/server.json` (M3).
  tts:
    volumes: !override
      # Lot 9 (M3) : le DOSSIER de config (monté en `rw` côté gateway, M2) est
      # monté ici en `ro` sur `/config`. Le MÊME dossier hôte est partagé.
      - type: bind
        source: ${YUKI_HOST_TTS_CONFIG_DIR:-./.local/tts-config}
        target: /config
        read_only: true
      - type: bind
        source: ${YUKI_HOST_MODELS_DIR:-./.local/models}
        target: /models
        read_only: true
      - type: bind
        source: ${YUKI_HOST_VOICES_DIR:-./.local/voices}
        target: /voices
        read_only: true
