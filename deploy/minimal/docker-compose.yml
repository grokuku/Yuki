# Déploiement MINIMAL de Yuki. Copier ce dossier tel quel sur le serveur, puis :
#   cp .env.example .env && docker compose up -d
# Toute la configuration applicative (clés LLM, GPU, prompts…) se règle ensuite
# depuis la page /config : elle est persistée sur le volume `state`.
name: yuki-minimal

services:
  gateway:
    image: ghcr.io/grokuku/yuki:${YUKI_VERSION:-latest}
    env_file: .env
    # Le port CONTENEUR reste fixe (8080) ; seul le port HÔTE est paramétrable.
    environment:
      YUKI_GATEWAY_PORT: "8080"
    ports:
      - "${YUKI_GATEWAY_PORT:-8080}:8080"
    # 5 volumes nommés ; le gateway monte `models` en `rw` (Lot 9, M1 : le
    # moteur `tts`, s'il est ajouté, le monterait en `ro`).
    volumes:
      - pi:/data/pi
      - workspace:/workspace
      - models:/models
      - state:/data/state
      - voices:/voices
    restart: unless-stopped
    # Rootfs immuable : l'état vit uniquement dans les volumes ; /tmp est tmpfs.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Réservation GPU (forme requise par le NVIDIA Container Toolkit).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pi:
  workspace:
  models:
  state:
  voices:
