# =============================================================================
# Yuki — déploiement SERVEUR autonome (fichier unique, copiable seul).
#
#   docker compose up -d
#
# Ce compose TIRE l'image publiée `ghcr.io/grokuku/yuki` : aucune construction,
# aucune préparation de l'hôte, aucun clone du dépôt n'est nécessaire. Seuls ce
# fichier et un `.env` (dérivé de `.env.example`) sont requis.
#
# La persistance passe par 5 VOLUMES NOMMÉS, préfixés `yuki-server-*` pour ne
# pas entrer en collision avec un autre déploiement Yuki sur la même machine.
# Pour un volume nommé monté sur un chemin qui EXISTE déjà dans l'image, Docker
# initialise le volume avec le CONTENU et le PROPRIÉTAIRE du répertoire de
# l'image (créé en `YUKI_UID:YUKI_GID` par le Dockerfile) : le conteneur
# non-root écrit donc dedans sans aucune préparation sur l'hôte.
#
# ⚠️  L'image publiée est construite avec uid/gid 1000. Changer `YUKI_UID`/
#     `YUKI_GID` SANS reconstruire l'image rend le conteneur non-root étranger
#     à ses volumes → erreurs de permissions (`/health/ready` → 503).
#
# ⚠️  C'est le VRAI GPU qui doit être détecté : aucune variable de simulation
#     (`YUKI_GPU_FIXTURE`) ni de CI n'est définie ici.
#
# Les chemins de montage (`/data/pi`, `/workspace`, `/models`, `/data/state`)
# sont EXACTEMENT ceux attendus par le code (`src/config/env.ts`).
# =============================================================================

name: yuki-server

services:
  gateway:
    # Tags réels publiés sur ghcr.io : `:latest` et `:<version>` (workflow de
    # release, MANUEL) ; `:test` et `:sha-<court>` (workflow de CI). `:latest`
    # n'existe que si une release a été lancée AU MOINS une fois — sinon tirer
    # `:test`. Épingler une version : YUKI_VERSION dans `.env`.
    image: ghcr.io/grokuku/yuki:${YUKI_VERSION:-latest}
    container_name: yuki-server-gateway

    env_file:
      - .env
    environment:
      NODE_ENV: production
      YUKI_VERSION: ${YUKI_VERSION:-0.1.0}
      YUKI_LOG_LEVEL: ${YUKI_LOG_LEVEL:-info}
      # Port CONTENEUR fixe (8080) ; seul le port HÔTE est paramétrable.
      YUKI_GATEWAY_PORT: "8080"
      YUKI_GATEWAY_HOST: 0.0.0.0
      YUKI_CONFIG_DIR: ${YUKI_CONFIG_DIR:-./config}

      # --- Chemins conteneur des volumes nommés ---
      YUKI_MOUNT_PI_AGENT: /data/pi
      YUKI_MOUNT_WORKSPACE: /workspace
      YUKI_MOUNT_MODELS: /models
      YUKI_MOUNT_STATE: /data/state
      # Volume des voix TTS (Lot 7) — registre + échantillons (rw gateway).
      YUKI_MOUNT_VOICES: /voices

      # --- Pi embarqué : état du SDK redirigé hors du rootfs read-only ---
      YUKI_PI_AGENT_DIR: /data/pi/agent
      YUKI_PI_SESSIONS_DIR: /data/pi/agent/sessions
      YUKI_PI_HOME: /data/pi/home
      YUKI_PI_CWD: /workspace
      YUKI_PI_SYSTEM_PROMPT: /app/config/pi/system-prompt.md
      YUKI_PI_SETTINGS_SEED: /app/config/pi/settings.json
      YUKI_PI_HEAVY_SYSTEM_PROMPT: /app/config/pi/system-prompt-heavy.md

      # --- Environnement SDK Pi (HOME inscriptible sur le volume pi) ---
      HOME: /data/pi/home
      PI_CODING_AGENT_DIR: /data/pi/agent
      PI_CODING_AGENT_SESSION_DIR: /data/pi/agent/sessions
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"

      # --- Injection GPU NVIDIA (preuve du passthrough) ---
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    # Exécution non-root. ⚠️ Ne changer ces valeurs qu'en reconstruisant l'image.
    user: "${YUKI_UID:-1000}:${YUKI_GID:-1000}"

    ports:
      - "${YUKI_GATEWAY_PORT:-8080}:8080"

    # 5 volumes nommés (RW sauf `models`, monté en lecture seule `:ro`).
    volumes:
      - type: volume
        source: yuki-server-pi
        target: /data/pi
      - type: volume
        source: yuki-server-workspace
        target: /workspace
      - type: volume
        source: yuki-server-models
        target: /models
        read_only: true
      - type: volume
        source: yuki-server-state
        target: /data/state
      # Lot 7 : voix TTS (rw pour le gateway, ro pour le service `tts`).
      - type: volume
        source: yuki-server-voices
        target: /voices

    networks:
      - yuki-server-net

    restart: unless-stopped
    init: true

    # Rootfs immuable ; seul /tmp est inscriptible (tmpfs).
    read_only: true
    tmpfs:
      - /tmp

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    # Healthcheck sans curl : le binaire Node embarque `fetch`.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Réservation GPU (forme requise par le NVIDIA Container Toolkit).
    # `capabilities` est obligatoire.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ===========================================================================
  # Service TTS (Lot 7) — DÉMARRÉ AVEC LA STACK (plus de profil Compose).
  #
  # Ce compose est fait pour un déploiement SERVEUR piloté par
  # `docker compose up -d` (sans option). Un service derrière
  # `profiles: ["tts"]` ne serait donc JAMAIS démarré par cette commande —
  # ni par une UI type Docky qui lance `up -d` sans profil. Le moteur démarre
  # donc avec la stack. Pour l'exclure : `docker compose up -d gateway`.
  #
  # CONTREPARTIE : le conteneur `tts` tourne en permanence et son image CUDA
  # (lourde) est tirée au premier déploiement. La VRAM n'est consommée qu'à
  # l'usage (`lazy_load`) — à vérifier en réel avec l'image (non attesté).
  #
  # audio.cpp (Chatterbox Multilingual V3, CUDA NVIDIA uniquement). L'image se
  # choisit via `YUKI_TTS_IMAGE` dans `.env` (`full-cuda13` par défaut).
  #
  # ⚠️ COMMANDE (spec §13/C14) — corrigée d'après une EXÉCUTION RÉELLE :
  # l'ENTRYPOINT de l'image est un DISPATCHER à sous-commandes
  # (`cli`, `server`, `model-manager`, `perf`). Passer `--config` en 1er argument
  # échoue avec « Unknown command: --config » (voir `docs/lot8.md` §11.4).
  # Le 1er argument doit donc être la sous-commande `server`.
  #
  # Hôte/port ne sont PAS des flags : ce sont des CLÉS DU FICHIER DE CONFIG
  # (`host`/`port`). Le fichier est monté ci-dessous (bind, ro) :
  # copier `audiocpp-server.json.example` → `audiocpp-server.json`, puis
  # renseigner le chemin RÉEL du GGUF (clé `models[].path`).
  #
  # ⚠️ RESTE À CONFIRMER EN RÉEL : le chemin du fichier de config DANS le
  # conteneur (`/app/server.json` suppose le WORKDIR `/app`).
  # ===========================================================================
  tts:
    image: ${YUKI_TTS_IMAGE:-ghcr.io/0xshug0/audio.cpp:full-cuda13}
    container_name: yuki-server-tts
    # Dispatcher audio.cpp → sous-commande `server`, puis `--config <fichier>`.
    command: ["server", "--config", "/app/server.json"]
    networks:
      - yuki-server-net
    volumes:
      # Configuration du serveur (fournie par l'opérateur) — lecture seule.
      # Copier `audiocpp-server.json.example` vers `./audiocpp-server.json`.
      - type: bind
        source: ./audiocpp-server.json
        target: /app/server.json
        read_only: true
      - type: volume
        source: yuki-server-models
        target: /models
        read_only: true
      - type: volume
        source: yuki-server-voices
        target: /voices
        read_only: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

networks:
  yuki-server-net:
    name: yuki-server-net

volumes:
  yuki-server-pi:
    name: yuki-server-pi
  yuki-server-workspace:
    name: yuki-server-workspace
  yuki-server-models:
    name: yuki-server-models
  yuki-server-state:
    name: yuki-server-state
  # Lot 7 : médias de voix (registre + WAV).
  yuki-server-voices:
    name: yuki-server-voices
