# =============================================================================
# Yuki — déploiement SERVEUR autonome (fichier unique, copiable seul).
#
#   docker compose up -d
#
# Ce compose TIRE l'image publiée `ghcr.io/grokuku/yuki` : aucune construction,
# aucune préparation de l'hôte, aucun clone du dépôt n'est nécessaire. Seuls ce
# fichier et un `.env` (dérivé de `.env.example`) sont requis.
#
# La persistance passe par 4 VOLUMES NOMMÉS, préfixés `yuki-server-*` pour ne
# pas entrer en collision avec un autre déploiement Yuki sur la même machine.
# Pour un volume nommé monté sur un chemin qui EXISTE déjà dans l'image, Docker
# initialise le volume avec le CONTENU et le PROPRIÉTAIRE du répertoire de
# l'image (créé en `YUKI_UID:YUKI_GID` par le Dockerfile) : le conteneur
# non-root écrit donc dedans sans aucune préparation sur l'hôte.
#
# ⚠️  L'image publiée est construite avec uid/gid 1000. Changer `YUKI_UID`/
#     `YUKI_GID` SANS reconstruire l'image rend le conteneur non-root étranger
#     à ses volumes → erreurs de permissions (`/health/ready` → 503).
#
# ⚠️  C'est le VRAI GPU qui doit être détecté : aucune variable de simulation
#     (`YUKI_GPU_FIXTURE`) ni de CI n'est définie ici.
#
# Les chemins de montage (`/data/pi`, `/workspace`, `/models`, `/data/state`)
# sont EXACTEMENT ceux attendus par le code (`src/config/env.ts`).
# =============================================================================

name: yuki-server

services:
  gateway:
    # Tags réels publiés sur ghcr.io : `:latest` et `:<version>` (workflow de
    # release, MANUEL) ; `:test` et `:sha-<court>` (workflow de CI). `:latest`
    # n'existe que si une release a été lancée AU MOINS une fois — sinon tirer
    # `:test`. Épingler une version : YUKI_VERSION dans `.env`.
    image: ghcr.io/grokuku/yuki:${YUKI_VERSION:-latest}
    container_name: yuki-server-gateway

    env_file:
      - .env
    environment:
      NODE_ENV: production
      YUKI_VERSION: ${YUKI_VERSION:-0.1.0}
      YUKI_LOG_LEVEL: ${YUKI_LOG_LEVEL:-info}
      # Port CONTENEUR fixe (8080) ; seul le port HÔTE est paramétrable.
      YUKI_GATEWAY_PORT: "8080"
      YUKI_GATEWAY_HOST: 0.0.0.0
      YUKI_COMPAT_MODE: ${YUKI_COMPAT_MODE:-strict}
      YUKI_PROFILE: ${YUKI_PROFILE:-}
      YUKI_MIN_DRIVER: ${YUKI_MIN_DRIVER:-580}
      YUKI_CONFIG_DIR: ${YUKI_CONFIG_DIR:-./config}

      # --- Chemins conteneur des volumes nommés ---
      YUKI_MOUNT_PI_AGENT: /data/pi
      YUKI_MOUNT_WORKSPACE: /workspace
      YUKI_MOUNT_MODELS: /models
      YUKI_MOUNT_STATE: /data/state

      # --- Pi embarqué : état du SDK redirigé hors du rootfs read-only ---
      YUKI_PI_AGENT_DIR: /data/pi/agent
      YUKI_PI_SESSIONS_DIR: /data/pi/agent/sessions
      YUKI_PI_HOME: /data/pi/home
      YUKI_PI_CWD: /workspace
      YUKI_PI_SYSTEM_PROMPT: /app/config/pi/system-prompt.md
      YUKI_PI_SETTINGS_SEED: /app/config/pi/settings.json
      YUKI_PI_MODELS_SEED: /app/config/pi/models.json
      YUKI_PI_HEAVY_SYSTEM_PROMPT: /app/config/pi/system-prompt-heavy.md
      YUKI_PI_MODEL: ${YUKI_PI_MODEL:-}
      YUKI_PI_THINKING: ${YUKI_PI_THINKING:-}

      # --- Multi-LLM & jobs ---
      YUKI_LLM_MISSING_KEY_MODE: ${YUKI_LLM_MISSING_KEY_MODE:-degrade}
      YUKI_JOBS_STORE_PATH: /data/state/jobs.jsonl
      YUKI_HEAVY_MAX_CONCURRENT: ${YUKI_HEAVY_MAX_CONCURRENT:-3}
      YUKI_HEAVY_MAX_QUEUE: ${YUKI_HEAVY_MAX_QUEUE:-10}
      YUKI_HEAVY_IDLE_TIMEOUT_MS: ${YUKI_HEAVY_IDLE_TIMEOUT_MS:-120000}
      YUKI_HEAVY_TOTAL_TIMEOUT_MS: ${YUKI_HEAVY_TOTAL_TIMEOUT_MS:-1200000}

      # --- Clés LLM : injectées depuis `.env`, jamais en clair ici ---
      # `config/pi/models.json` les référence par `$…_API_KEY`.
      YUKI_LLM_LIGHT_API: ${YUKI_LLM_LIGHT_API:-openai-completions}
      YUKI_LLM_LIGHT_BASE_URL: ${YUKI_LLM_LIGHT_BASE_URL:-https://ollama.com/v1}
      YUKI_LLM_LIGHT_API_KEY: ${YUKI_LLM_LIGHT_API_KEY:-}
      YUKI_LLM_LIGHT_MODEL: ${YUKI_LLM_LIGHT_MODEL:-gemma4:31b}
      YUKI_LLM_LIGHT_THINKING: ${YUKI_LLM_LIGHT_THINKING:-off}
      YUKI_LLM_HEAVY_API: ${YUKI_LLM_HEAVY_API:-openai-completions}
      YUKI_LLM_HEAVY_BASE_URL: ${YUKI_LLM_HEAVY_BASE_URL:-https://ollama.com/v1}
      YUKI_LLM_HEAVY_API_KEY: ${YUKI_LLM_HEAVY_API_KEY:-}
      YUKI_LLM_HEAVY_MODEL: ${YUKI_LLM_HEAVY_MODEL:-deepseek-v4.1-flash}
      YUKI_LLM_HEAVY_THINKING: ${YUKI_LLM_HEAVY_THINKING:-high}

      # --- Environnement SDK Pi (HOME inscriptible sur le volume pi) ---
      HOME: /data/pi/home
      PI_CODING_AGENT_DIR: /data/pi/agent
      PI_CODING_AGENT_SESSION_DIR: /data/pi/agent/sessions
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"

      # --- Transport temps réel ---
      YUKI_WS_REPLAY_BUFFER: ${YUKI_WS_REPLAY_BUFFER:-1000}
      YUKI_WS_REPLAY_BYTES: ${YUKI_WS_REPLAY_BYTES:-5000000}

      # --- Injection GPU NVIDIA (preuve du passthrough) ---
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    # Exécution non-root. ⚠️ Ne changer ces valeurs qu'en reconstruisant l'image.
    user: "${YUKI_UID:-1000}:${YUKI_GID:-1000}"

    ports:
      - "${YUKI_GATEWAY_PORT:-8080}:8080"

    # 4 volumes nommés (RW sauf `models`, monté en lecture seule `:ro`).
    volumes:
      - type: volume
        source: yuki-server-pi
        target: /data/pi
      - type: volume
        source: yuki-server-workspace
        target: /workspace
      - type: volume
        source: yuki-server-models
        target: /models
        read_only: true
      - type: volume
        source: yuki-server-state
        target: /data/state

    networks:
      - yuki-server-net

    restart: unless-stopped
    init: true

    # Rootfs immuable ; seul /tmp est inscriptible (tmpfs).
    read_only: true
    tmpfs:
      - /tmp

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    # Healthcheck sans curl : le binaire Node embarque `fetch`.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Réservation GPU (forme requise par le NVIDIA Container Toolkit).
    # `capabilities` est obligatoire.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  yuki-server-net:
    name: yuki-server-net

volumes:
  yuki-server-pi:
    name: yuki-server-pi
  yuki-server-workspace:
    name: yuki-server-workspace
  yuki-server-models:
    name: yuki-server-models
  yuki-server-state:
    name: yuki-server-state
