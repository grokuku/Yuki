<!doctype html>
<html lang="fr" data-theme="neutre-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Yuki</title>
    <link rel="stylesheet" href="/ui/styles.css" />
    <link rel="stylesheet" href="/ui/themes.css" />
    <!-- HolafModal — CSS extrait via getCss(), servi statiquement (CSP style-src 'self'). -->
    <link rel="stylesheet" href="/ui/vendor/holaf/holaf-modal.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Yuki</div>
      <div class="status">
        <a class="pill" href="/config">Configuration</a>
        <a class="pill" href="/config#voix">Voix</a>
        <span id="connection" class="pill pill--offline">hors ligne</span>
        <span id="session-state" class="pill">idle</span>
        <span id="queued" class="pill pill--queued" hidden>en file</span>
        <div class="theme-control">
          <select id="theme-family" name="theme-family" aria-label="Choisir la famille de thème">
            <option value="corail">Corail</option>
            <option value="ambre">Ambre</option>
            <option value="emeraude">Émeraude</option>
            <option value="turquoise">Turquoise</option>
            <option value="amethyste">Améthyste</option>
            <option value="neutre">Neutre</option>
          </select>
          <!--
            Icônes MONOCHROMES du bouton de mode : rendues par la brique
            holaf-lib `icons` via `theme.js` (`HolafIcons.render("sun"/"moon")`),
            classes `.icon .icon--sun` / `.icon .icon--moon`, `stroke`
            `currentColor` + `--icon-color` (CSP : aucun style inline).
            Le mode (`data-theme`) décide lequel est visible (styles.css).
          -->
          <button id="theme-toggle" type="button" aria-label="Passer en mode clair" aria-pressed="true"></button>
        </div>
        <span class="theme-control">
          <!-- Voix : haut-parleur / haut-parleur barré rendus par la brique
               holaf-lib `icons` via `theme.js`
               (`HolafIcons.render("volume"/"volume-off")`), classes
               `.icon .icon--volume` / `.icon .icon--volume-off`,
               `stroke="currentColor"` + `--icon-color` (CSP : aucun style
               inline). Les classes d'état (`tts-toggle--off`/`--muted` posées
               par app.js) décident lequel est visible (styles.css). -->
          <button
            id="tts-toggle"
            type="button"
            aria-label="Couper la voix"
            aria-pressed="false"
            title="Voix"
          ></button>
        </span>
        <span id="tts-status" class="tts-status" role="status" aria-live="polite" hidden></span>
      </div>
    </header>

    <!--
      Coquille à deux colonnes : barre latérale des conversations (rendue par
      `sessions-panel.js`, `<aside>` vide dans le markup) + zone de discussion.
      Le fil REMPLIT la largeur disponible (aucune borne de lecture).
    -->
    <div class="shell">
      <aside id="sessions-sidebar" class="sidebar" aria-label="Conversations"></aside>
      <div id="chat" class="chat">
        <main id="conversation" class="conversation" aria-live="polite">
          <p class="empty">Envoyez un message pour commencer.</p>
        </main>

        <!-- État « aucune conversation ouverte » (même coquille : barre du haut
             et barre latérale restent visibles). Jamais une erreur : on le dit. -->
        <section id="empty-state" class="empty-state">
          <div class="empty-state__logo" aria-hidden="true">❄️</div>
          <div class="empty-state__name">Yuki</div>
          <p class="empty-state__hint">Sélectionnez une conversation ou créez-en une.</p>
          <button id="empty-new" class="button" type="button">Nouvelle conversation</button>
          <p class="empty-state__honest">
            Aucune conversation n'est ouverte. <strong>Ce n'est pas une erreur</strong> :
            reprenez un fil à gauche, ou démarrez-en un nouveau.
          </p>
        </section>

        <div id="thinking" class="thinking-indicator" hidden>réflexion…</div>

        <footer class="composer">
          <textarea
            id="input"
            class="input"
            rows="1"
            placeholder="Écrivez un message… (Entrée pour envoyer, Maj+Entrée pour un retour ligne)"
            aria-label="Message"
          ></textarea>
          <button id="send" class="button" type="button">Envoyer</button>
          <button id="stop" class="button button--stop" type="button" disabled>
            Stop
          </button>
        </footer>
      </div>
    </div>

    <script src="/ui/app.js" type="module"></script>
  </body>
</html>
