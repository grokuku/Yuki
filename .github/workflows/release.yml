# =============================================================================
# Yuki — Publication de l'image Docker (GitHub Container Registry, `ghcr.io`).
#
# Mécanisme repris FIDÈLEMENT de Docky
# (/projects/Docky/.github/workflows/release.yml) :
#
#   lire `version.txt` → construire et pousser l'image taguée `:<version>` +
#   `:latest` → incrémenter `version.txt` (patch) → commit → push.
#
#   * `version.txt` (racine du dépôt) est la SOURCE UNIQUE de vérité de la
#     version : plus aucune saisie manuelle, plus aucun tag Git.
#   * Déclenchement MANUEL uniquement (`workflow_dispatch`), comme Docky : le
#     push du commit d'incrémentation sur `main` ne peut donc PAS relancer ce
#     workflow (garde anti-boucle).
#   * Permissions : `contents: write` (push du commit de version) +
#     `packages: write` (push de l'image sur ghcr.io).
#
# Écart conservé vs Docky : build `linux/amd64` uniquement (pas de QEMU) —
# l'usage réel est amd64 (GPU/NVIDIA amd64, images CUDA amd64-only).
#
# ⚠️ NE PAS CONFONDRE avec la règle « pas de tag `latest` » du projet :
#    cette règle vise les IMAGES DE BASE (Node, CUDA) épinglées par digest.
#    Publier `:latest` pour l'IMAGE DU PROJET est ici VOULU : `:latest` suit le
#    dernier build publié, tandis que `:<version>` et `:sha-<court>` permettent
#    d'épingler un artefact reproductible.
# =============================================================================
name: Release image

on:
  # Publication manuelle uniquement. Aucun déclencheur `push` (ni branche, ni
  # tag `v*`) : la version vient exclusivement de `version.txt`. C'est aussi le
  # garde anti-boucle — le commit de bump poussé sur `main` ne relance rien.
  workflow_dispatch:

# Empêche deux publications simultanées : deux runs manuels concurrents
# incrémenteraient `version.txt` deux fois et/ou écraseraient la version.
# Groupe constant (sérialise TOUS les runs de ce workflow) et
# `cancel-in-progress: false` (on ne tue jamais un push d'image à mi-course).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # `github.repository` vaut « grokuku/Yuki » ; mis en minuscules plus bas
  # (ghcr n'accepte que le minuscule). Ne pas écrire le nom d'image en dur.
  IMAGE_REPOSITORY: ${{ github.repository }}
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # Garde-fou qualité : la publication ne part QUE si ces vérifications passent.
  # (Job préexistant, conservé : la publication dépend de la qualité.)
  # ---------------------------------------------------------------------------
  quality:
    name: Typecheck, tests & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (intégrations réseau opt-in skippées)
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Publication de l'image du gateway sur ghcr.io, puis bump de `version.txt`.
  # ---------------------------------------------------------------------------
  publish:
    name: Build, push & bump version
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit + push de `version.txt`
      packages: write # push de l'image sur ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- 1. Lire la version (source unique de vérité) ---------------------
      - name: Read version from version.txt
        id: version
        run: |
          set -euo pipefail
          FILE="version.txt"
          if [ ! -f "${FILE}" ]; then
            echo "::error::${FILE} introuvable à la racine du dépôt."
            exit 1
          fi
          VERSION="$(tr -d '[:space:]' < "${FILE}")"
          if [ -z "${VERSION}" ]; then
            echo "::error::${FILE} est vide."
            exit 1
          fi
          # Le format MAJOR.MINOR.PATCH est requis par la règle d'incrémentation
          # (voir étape « Increment version.txt »).
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version invalide « ${VERSION} » dans ${FILE} (attendu : MAJOR.MINOR.PATCH, ex. 0.1.0)."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Version lue : ${VERSION}"

      # --- 2. Construire et pousser l'image AVEC la version courante --------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference and tags
        id: meta
        env:
          # Version validée par l'étape précédente (MAJOR.MINOR.PATCH) : passée
          # via `env`, jamais interpolée directement dans le script.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # ghcr.io n'accepte QUE des références en minuscules.
          IMAGE="${REGISTRY}/$(printf '%s' "${IMAGE_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          SHA_SHORT="$(git rev-parse --short HEAD)"

          # `:latest` ET `:<version>` proviennent du MÊME numéro (version.txt).
          TAGS="${IMAGE}:${VERSION}"$'\n'"${IMAGE}:latest"$'\n'"${IMAGE}:sha-${SHA_SHORT}"

          {
            echo "image=${IMAGE}"
            echo "sha_short=${SHA_SHORT}"
            echo "tags<<YUKI_IMAGE_TAGS"
            printf '%s\n' "${TAGS}"
            echo "YUKI_IMAGE_TAGS"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "IMAGE=${IMAGE}"
            echo "VERSION=${VERSION}"
          } >> "${GITHUB_ENV}"

          echo "Image   : ${IMAGE}"
          echo "Version : ${VERSION}"
          echo "Tags    :"
          while IFS= read -r tag; do printf '  - %s\n' "${tag}"; done <<< "${TAGS}"

      - name: Resolve base image source (miroir public, repli GHCR)
        id: base
        env:
          # Le propriétaire GHCR suit le dépôt (minuscules imposées plus bas).
          YUKI_GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Sonde les registres : miroir public `mirror.gcr.io` d'abord, copie
          # GHCR ensuite. Échec explicite si aucune ne répond — jamais un build
          # de 10 minutes qui meurt sur un 429 anonyme.
          REF="$(./scripts/node-base-ref.sh resolve)"
          FALLBACK="$(./scripts/node-base-ref.sh fallback)"

          {
            echo "ref=${REF}"
            echo "fallback=${FALLBACK}"
          } >> "${GITHUB_OUTPUT}"

          echo "Image de base         : ${REF}"
          echo "Repli (si échec)      : ${FALLBACK}"

      - name: Build and push image
        id: build
        # Un échec ici n'est PAS fatal : l'étape suivante réessaie sur le repli.
        # Le job échoue quand même si les DEUX échouent (étape explicite plus bas).
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/gateway/Dockerfile
          # `linux/amd64` seul (usage GPU/NVIDIA amd64 ; lots CUDA amd64-only).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Source de l'image de base : SEUL paramètre qui change de registre.
          build-args: |
            NODE_BASE=${{ steps.base.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image (repli GHCR)
        # Bascule UNIQUEMENT si le premier build a échoué (registre mort, quota
        # atteint en cours de pull…). `continue-on-error` pour pouvoir émettre un
        # message unique et explicite si ce repli échoue AUSSI.
        id: build_fallback
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NODE_BASE=${{ steps.base.outputs.fallback }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avertissement si la release n'a pu se faire que par le repli
        if: steps.build_fallback.outcome == 'success'
        env:
          REF: ${{ steps.base.outputs.ref }}
          FALLBACK: ${{ steps.base.outputs.fallback }}
        run: |
          set -euo pipefail
          echo "::warning::image construite depuis le REPLI GHCR (${FALLBACK}) : le miroir public ${REF} n'a pas répondu. Réalimenter GHCR (workflow « Miroir image de base (GHCR) ») et vérifier le miroir."

      - name: Échec explicite si aucun registre n'a fourni l'image de base
        if: steps.build.outcome == 'failure' && steps.build_fallback.outcome == 'failure'
        env:
          REF: ${{ steps.base.outputs.ref }}
          FALLBACK: ${{ steps.base.outputs.fallback }}
        run: |
          set -euo pipefail
          # Message actionnable : on ne laisse pas un « build failed » nu.
          echo "::error::aucune source d'image de base n'a fonctionné (${REF} puis ${FALLBACK}). Réalimenter GHCR : workflow « Miroir image de base (GHCR) » (docs/versions.md § « Réalimentation du miroir (repli GHCR) »)."
          exit 1

      # --- 3. Incrémenter la version (APRÈS le push de l'image) -------------
      - name: Increment version.txt
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '[:space:]' < version.txt)"
          MAJOR="$(echo "${CURRENT}" | cut -d. -f1)"
          MINOR="$(echo "${CURRENT}" | cut -d. -f2)"
          PATCH="$(echo "${CURRENT}" | cut -d. -f3)"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "${NEW_VERSION}" > version.txt
          echo "Nouvelle version : ${NEW_VERSION}"

      # --- 4. Committer et pousser le bump ----------------------------------
      - name: Commit and push new version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: bump version to $(cat version.txt)"
          git push

      - name: Summary
        run: |
          {
            echo "### Image publiée sur ${REGISTRY}"
            echo
            echo "| Tag | Référence |"
            echo "| --- | --- |"
            echo "| version | \`${IMAGE}:${VERSION}\` |"
            echo "| latest | \`${IMAGE}:latest\` |"
            echo "| immuable | \`${IMAGE}:sha-${{ steps.meta.outputs.sha_short }}\` |"
            echo
            echo "Version suivante : \`$(cat version.txt)\` (commit poussé par le workflow)."
          } >> "${GITHUB_STEP_SUMMARY}"
