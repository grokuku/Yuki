# =============================================================================
# Yuki — CI AUTONOME de l'« agent d'exécution » (Lot 4).
#
# ⚠️ La compilation elle-même vit dans `agent-build.yml` (workflow
# RÉUTILISABLE, `workflow_call`), pour être partagée mot pour mot avec la
# publication unifiée (`release.yml`) : une seule copie de la logique de build,
# donc aucune dérive entre « CI de l'agent » et « publication ». Ce fichier ne
# garde que l'ORCHESTRATION et la release de REJEU manuel.
#
# ⚠️ UN SEUL NUMÉRO DE VERSION : `version.txt` (racine du dépôt), le MÊME que
# l'image du gateway (`ghcr.io/grokuku/yuki:<version>`). Le fichier `VERSION` de
# `agent/` a été
# SUPPRIMÉ (deux fichiers de version = divergence garantie). La version est
# injectée à la compilation, donc `yuki-agent version` affiche le numéro publié.
#
# Déclencheurs (comportement historique conservé) :
#   * `push` vers `main`  → compilation + artefacts (rétention 7 j) ;
#   * `pull_request`      → compilation VALIDÉE, aucun artefact publié ;
#   * `workflow_dispatch` → compilation + GitHub Release `v<version>`.
#     (`create_release: false` = compiler sans publier.)
#
# ⚠️ La publication CANONIQUE (image + binaires + release, dans la même action)
# est `release.yml`. Ce workflow reste la porte de REJEU de l'agent seul : s'il
# rejoue une version déjà publiée, la création de la release ÉCHOUE avec un
# message explicite (« incrémentez version.txt ») — jamais d'écrasement.
#
# Aucun secret à configurer : le jeton éphémère `GITHUB_TOKEN` suffit (lecture
# des artefacts implicite ; `contents: write` seulement pour créer la release).
# Versions d'actions et de Go ÉPINGLÉES (règle maison : pas de `latest`/`main`).
# =============================================================================
name: Agent (binaires)

on:
  push:
    branches: [main]
    # Filtre ESSENTIEL : ne rien lancer quand seul le gateway Node change.
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
      - '.github/workflows/agent-build.yml'
      # `version.txt` porte la version INJECTÉE dans les binaires : un bump doit
      # recompiler (sinon l'artefact publié porterait l'ancien numéro).
      - 'version.txt'
  pull_request:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
      - '.github/workflows/agent-build.yml'
      - 'version.txt'
  # Porte de rejeu manuel : (re)compile et PUBLIE une release `v<version>`.
  workflow_dispatch:
    inputs:
      create_release:
        description: "Créer la GitHub Release v<version> (false = compiler seulement)"
        type: boolean
        default: true

# Permissions minimales par défaut : lecture seule. Le job `agent-release`
# relève `contents` à `write` (création de la release) et RIEN d'autre.
permissions:
  contents: read

# Annulation des exécutions obsolètes UNIQUEMENT pour les PR. Sur `push` vers
# `main` et sur `workflow_dispatch`, on sérialise (jamais de release à mi-course).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Compilation : délègue TOUT au workflow réutilisable (qualité Go + matrice des
  # 4 cibles + artefacts). Aucune version transmise ⇒ il lit `version.txt`.
  # ---------------------------------------------------------------------------
  agent-build:
    name: Compilation de l'agent
    uses: ./.github/workflows/agent-build.yml

  # ---------------------------------------------------------------------------
  # GitHub Release, UNIQUEMENT sur `workflow_dispatch` (déclenchement manuel).
  #
  # Choix : PAS de déclencheur sur tag `v*`. Le projet a acté que la version est
  # lue dans un FICHIER (`version.txt`, unique pour l'image ET l'agent) et que la
  # publication est manuelle (voir `release.yml`) — « plus aucun tag Git poussé à
  # la main ». Le tag `v<version>` est CRÉÉ par ce job (ou par `release.yml`) au
  # moment de la release.
  # ---------------------------------------------------------------------------
  agent-release:
    name: Release des binaires de l'agent
    needs: agent-build
    # ⚠️ `github.event.inputs` (et pas le contexte `inputs`) : ce job est évalué
    # aussi sur `push`/`pull_request`, où le contexte `inputs` n'a pas de sens.
    # `github.event` existe sur TOUS les événements, donc l'expression est sûre.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # création de la GitHub Release + du tag `v<version>`
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lire la version (version.txt)
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < version.txt)"
          if [ -z "${VERSION}" ]; then
            echo "::error::version.txt est vide."
            exit 1
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version invalide « ${VERSION} » dans version.txt (attendu MAJOR.MINOR.PATCH)."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Version publiée : ${VERSION}"

      # `download-artifact` sans `merge-multiple` : chaque artefact est extrait
      # dans son propre sous-dossier `dist/<nom-d-artefact>/`.
      - name: Télécharger les artefacts de build
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Rassembler les binaires et recalculer l'empreinte
        run: |
          set -euo pipefail
          mkdir -p release
          # On ne récupère QUE les binaires (motif `yuki-agent-*`) : on ignore les
          # `SHA256SUMS` intermédiaires, propres à un artefact, qui entreraient en
          # collision une fois rassemblés.
          find dist -type f -name 'yuki-agent-*' -exec cp -t release {} +
          # Empreintes recalculées sur l'ENSEMBLE final : ce sont elles qui
          # accompagnent la release.
          ( cd release && sha256sum yuki-agent-* > SHA256SUMS )
          # Le déploiement minimal accompagne les binaires (même action GitHub).
          cp deploy/minimal/docker-compose.yml release/docker-compose.yml
          echo "Fichiers attachés à la release :"
          ls -l release
          cat release/SHA256SUMS

      - name: Créer la GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # ⚠️ AUCUN écrasement silencieux : un asset existant fait ÉCHOUER la commande au
          # lieu de l'écraser en silence.
          # Idempotence : une release ne se réécrit pas silencieusement.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::la release ${TAG} existe déjà — incrémentez version.txt avant de republier."
            exit 1
          fi
          gh release create "${TAG}" release/* \
            --target "${SHA}" \
            --title "Yuki v${VERSION}" \
            --notes "Binaires de l'agent d'exécution Yuki v${VERSION} (même numéro que l'image ghcr.io/grokuku/yuki:${VERSION}) : linux/amd64 et linux/arm64, libc-agnostiques (glibc ET musl/OpenWrt) ; windows/amd64 et windows/arm64 ; CGO_ENABLED=0. Vérifier les empreintes avec SHA256SUMS. Installation OpenWrt (procd) : agent/deploy/openwrt/README.md. ⚠️ Les releases antérieures propres à l'agent ne sont plus produites : le tag publié est désormais v<version>, le même numéro que l'image." \
            --latest=false
          echo "Release ${TAG} créée."
