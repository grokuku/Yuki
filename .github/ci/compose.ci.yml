# =============================================================================
# Surcharge Compose — CI GitHub Actions (runner `ubuntu-latest`, SANS GPU).
#
# Rôle : rendre le service `gateway` DÉMARRABLE et TESTABLE sur un runner sans
# GPU ni NVIDIA Container Toolkit, tout en conservant TOUT le reste de la
# définition (rootfs read-only, `tmpfs: /tmp`, utilisateur non-root, 4 volumes
# nommés, healthcheck). La logique GPU est exercée pour de vrai via une fixture
# `nvidia-smi` injectée (`YUKI_GPU_FIXTURE`), jamais via un GPU physique.
#
#   docker compose -f docker-compose.yml -f .github/ci/compose.ci.yml up -d
#
# Le compose de BASE tire désormais l'image publiée (`ghcr.io/grokuku/yuki`). En
# CI on ne veut PAS dépendre du registre : cette surcharge AJOUTE donc un
# `build:` local (avec un tag local `yuki-gateway:ci`, jamais poussé) pour
# construire l'image à partir du Dockerfile du dépôt.
#
# Seule la réservation GPU est retirée : sans pilote NVIDIA, `docker compose
# up` échouerait à la création du conteneur (« could not select device driver
# nvidia »). Le fichier est appliqué en surcharge ; le compose de base reste
# la référence pour la machine réelle.
# =============================================================================
services:
  gateway:
    # Contexte de build fourni en ABSOLU par `scripts/ci-smoke.sh`
    # (`YUKI_CI_BUILD_CONTEXT=$ROOT`) : évite toute ambiguïté de résolution des
    # chemins relatifs entre plusieurs `-f`.
    build:
      context: "${YUKI_CI_BUILD_CONTEXT:?YUKI_CI_BUILD_CONTEXT doit pointer vers la racine du dépôt}"
      dockerfile: infra/gateway/Dockerfile
      args:
        YUKI_UID: ${YUKI_UID:-1000}
        YUKI_GID: ${YUKI_GID:-1000}
    # Tag LOCAL, distinct de l'image publiée : la CI ne touche jamais au
    # registre. Le nom DOIT rester cohérent avec `IMAGE_LOCAL_TAG` dans
    # `.github/workflows/test-build.yml`.
    image: yuki-gateway:ci

    deploy:
      resources:
        reservations:
          # `!reset` (tag Compose, Docker Compose >= 2.24) supprime sans
          # ambiguïté la réservation GPU du compose de base. Une simple liste
          # vide dépendrait de la sémantique de fusion des séquences ; `!reset`
          # est l'outil documenté pour retirer une valeur héritée.
          devices: !reset []

    environment:
      # Fixture nvidia-smi montée ci-dessous : la porte de compatibilité est
      # franchie à partir d'une sortie simulée, sans GPU.
      YUKI_GPU_FIXTURE: /fixtures/gpu.txt

    volumes:
      # Fixture injectée en lecture seule (en plus des 4 volumes nommés hérités
      # du compose de base : la liste est concaténée). Le chemin HÔTE est fourni
      # en absolu par `YUKI_CI_GPU_FIXTURE` (voir `scripts/ci-smoke.sh`) afin
      # d'éviter toute ambiguïté de résolution des chemins relatifs entre
      # plusieurs -f.
      - type: bind
        source: "${YUKI_CI_GPU_FIXTURE:?YUKI_CI_GPU_FIXTURE doit pointer vers une fixture nvidia-smi}"
        target: /fixtures/gpu.txt
        read_only: true
